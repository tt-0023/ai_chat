server:
  port: 8080
spring:
  application:
    name: ai-chat-service
#mysql配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_chat?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
#Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000
#Mybatis配置
  mybatis:
    mapper-locations: classpath*:mapper/*.xml
    type-aliases-package: com.example.ai_chat_service.entity
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


